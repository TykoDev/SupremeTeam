# Continuous integration for the Supreme Team catalog.
#
# This implements skills/runtime-manifest.yaml: the `ci_matrix` platforms, every
# supported Python version, the optional PyYAML both installed and absent, and one
# step per command listed under `ci.commands`. skills/scripts/validate_manifests.py
# fails when this file stops covering that declaration, so change the two together.
#
# Supply chain: the three actions below are GitHub's own and are pinned to a full
# commit SHA, with the release it is in as a comment, for the reason the ruff and
# npm pins give: a tag can move, and a gate whose verdict changes without a commit
# is a flaky one. Dependabot (.github/dependabot.yml) proposes each new release as
# a pull request, so a pin is raised by a reviewed commit. The job holds a
# read-only token and no secrets, and nothing is cached, so a poisoned cache cannot
# reach a later run.
#
# Each command is its own step on purpose. Windows PowerShell does not stop a
# multi-line script when an earlier native command fails, and one step per suite
# shows which suite broke.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.pyyaml }} PyYAML
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # skills/validation/_catalog.py reads this: a leg that promises PyYAML fails
    # when it is missing instead of skipping the tests that need it, and a leg that
    # promises its absence fails when it is present.
    env:
      SUPREMETEAM_PYYAML: ${{ matrix.pyyaml }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14"]
        pyyaml: [with, without]
        include:
          - os: ubuntu-latest
            launcher: python3
          - os: windows-latest
            launcher: py -3
          - os: macos-latest
            launcher: python3
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        if: matrix.pyyaml == 'with'
        run: python -m pip install PyYAML

      # The manifest declares a launcher per platform (`py -3` on Windows). It only
      # has to start a Python 3 here: which one it picks on a runner with several
      # installed is the image's choice, and the interpreter under test is the
      # `python` that setup-python put first on the path, which every step below uses.
      - name: The declared launcher starts Python
        run: ${{ matrix.launcher }} -c "import sys; print(sys.version)"

      - name: runtime_check
        run: python skills/scripts/check_runtime.py

      - name: manifests
        run: python skills/scripts/validate_manifests.py

      - name: hooks
        run: python -m unittest discover -s skills/harness/hooks -p "test_*.py"

      - name: gates
        run: python -m unittest discover -s skills/harness/gatekeeper -p "test_*.py"

      - name: validation
        run: python -m unittest discover -s skills/validation -p "test_*.py"

      - name: scripts
        run: python -m unittest discover -s skills/scripts -p "test_*.py"

      - name: taste
        run: python -m unittest discover -s skills/taste -p "test_*.py"

      - name: installers
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: skill_creator
        run: python -m unittest discover -s skills/skill-maker/skill-creator -p "test_*.py"

      # Last, so a suite that leaves residue in the tree fails the delivery check.
      - name: package_check
        run: python skills/scripts/package_check.py --root .

      - name: package_archive
        run: python skills/scripts/package_check.py --root . --out .harness-state/packages/supremeteam.zip

  # Not a runtime command, so it is not in the manifest's `ci.commands`: the linter is
  # a development tool, it reads the same files on every platform, and one run is
  # enough. skills/validation/test_lint_config.py holds this job to ruff.toml.
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Pinned exactly: a new ruff release adds rules, and a gate whose verdict
      # changes without a commit is a flaky one. Raise the pin with the fixes it needs.
      - name: Install ruff
        run: python -m pip install ruff==0.16.9

      - name: ruff
        run: ruff check .

  # The pi extension install_hooks.py generates is TypeScript that pi loads as is, so
  # it is type-checked here against pi's published extension API. Not a runtime
  # command either: it needs node and npm, which the catalog itself never does.
  # Every package is pinned exactly, for the reason the ruff pin gives.
  pi-bridge:
    name: pi extension (types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # 22.6 or later loads the extension's TypeScript directly, so PiExtensionTests run instead of skipping.
      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pi's types and the compiler
        run: npm install --prefix "$RUNNER_TEMP/pi-types" --no-audit --no-fund --ignore-scripts @earendil-works/pi-coding-agent@1.1.0 @types/node@22.20.5 typescript@5.9.3

      - name: pi extension
        run: SUPREMETEAM_PI_TYPES="$RUNNER_TEMP/pi-types" python -m unittest -v test_installer_hooks.PiRegistrationTests test_installer_hooks.PiExtensionTests test_installer_hooks.PiTypeCheckTests
        working-directory: skills/harness/hooks
