skill_name: admiral
target_path: admiral/
purpose: |
  Owns the space between stages, not the stages themselves: intake, run state,
  delegation, cross-stage gate routing, rewind, and delivery assembly. Selects
  the earliest incomplete approved boundary rather than the newest artifact on
  disk, and treats a lost _latest.md pointer as a recoverable orphan rather than
  as an absent run.
triggers:
  - run the full pipeline
  - design build review
  - continue from an approved design package
  - ship this end to end
  - resume the pipeline
  - design or build this project
  - redesign the UI
  - review or audit this codebase
  - run a security audit
  - QA this product
  - find the root cause
  - set or change my design preferences
  - create a skill
  - build me a skill for
  - create a team of skills
  - build me a pipeline for
  - run admiral
inputs:
  - user request and project constraints
  - approved upstream packages when resuming or running partial scope
  - persistence context when save state is active
outputs:
  - unified delivery package
  - handoff records for each completed cross-stage boundary
  - user escalation summary when a blocking decision is required
  - validated .skill package when running skill-creation mode
  - coordinated team package when running team-creation mode
severity_model: shared 4-tier (Critical | Major | Minor | Info)
required_contracts:
  - Execution-contract clauses stated verbatim in SKILL.md
  - Grill-Me Intake
  - Shared severity
  - Save-Protocol Adherence (write-probe before first save)
  - Mode Re-Check (per-boundary three-capability probe)
  - Entry Routing (admiral is the canonical first turn)
  - Session Routing (admiral pin while *_ACTIVE)
  - Harness Hook Registration
  - Runtime Readiness Diagnostic
  - Gate Spec Authority (gates.yaml and pipelines.yaml are authoritative)
  - Stack Lock
  - Design System Evidence
  - Taste
  - One Writer
  - Canonical Contracts
  - MCP Registry Freshness (480-hour TTL on mcp-tools.md)
discovery:
  mcp_registry_path: mcp-tools.md
  mcp_registry_max_age_hours: 480
  save_protocol_path: save-protocol.md
  persistence_probe_required: true
  mode_recheck_required: true
  session_pin_supported: true
authoring_rules:
  - First-principles wording only
  - No provenance or comparison language
  - No references to planning-note filenames inside generated artifacts
  - >-
      Supporting files sit one level deep (references/, agent/) and are directly
      referenced from SKILL.md. Two exceptions, each of which must still be directly
      referenced - a named sub-group under a bundled directory (agent/adapters/), and
      a nested skill shipped with its own SKILL.md and supporting tree
      (skill-maker/skill-creator/). Anything deeper that is neither is a packaging defect.
# Authoring-time checklist, not a shipped grade. Re-derived on every run; never
# read as a recorded result.
acceptance_checklist:
  - blocked-phrase scan returns zero hits
  - cross-cutting contracts embedded verbatim
  - every bundled file referenced from SKILL.md
  - package builds from the resolved output directory