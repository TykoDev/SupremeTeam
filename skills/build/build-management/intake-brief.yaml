skill_name: build-management
target_path: build/build-management/
purpose: |
  Sequences and assembles; the specialists write the code. Owns the build
  package as one revision with coherent evidence - implementation, tests,
  runtime health, hardening, and completeness certification that all describe
  the same commit - and the gate routing that carries it to build-to-review.
  Runtime health is unconditional and its smoke log is never substituted by a
  passing test suite.
triggers:
  - implement this design
  - start the build pipeline
  - build this project
  - turn the specification into code
  - execute the implementation plan
inputs:
  - approved design package or equivalent implementation specification
  - module and feature scope for the requested build
  - persistence context when delegated or resumed
outputs:
  - consolidated build package
  - phase approval records
  - remediation routing summary when revisions occur
severity_model: shared 4-tier (Critical | Major | Minor | Info)
required_contracts:
  - Execution-contract clauses stated verbatim in SKILL.md
  - Vendoring detection (mechanical non-first-party rule)
  - Save-Protocol Adherence
  - Fail-closed mandatory phases
gate:
  boundary: build-to-review
  submitter: build-management
  evidence_keys:
    - approved_design_revision
    - implementation
    - tests
    - runtime
    - traceability
    - security_evidence
  authored_here:
    - approved_design_revision
    - traceability
  artifact_backed:
    - tests
    - runtime
  waivable:
    - security_evidence
  not_waivable: approved_design_revision, implementation, tests, runtime, traceability
authoring_rules:
  - First-principles wording only
  - No provenance or comparison language
  - No references to planning-note filenames inside generated artifacts
  - >-
      Supporting files sit one level deep (references/, agent/) and are directly
      referenced from SKILL.md. Two exceptions, each of which must still be directly
      referenced - a named sub-group under a bundled directory (agent/adapters/), and
      a nested skill shipped with its own SKILL.md and supporting tree
      (skill-maker/skill-creator/). Anything deeper that is neither is a packaging defect.
# Authoring-time checklist, not a shipped grade. Re-derived on every run; never
# read as a recorded result.
acceptance_checklist:
  - blocked-phrase scan returns zero hits
  - cross-cutting contracts embedded verbatim
  - every bundled file referenced from SKILL.md