# Commander Agent Manifest

name: commander-agent
type: sub-orchestrator
version: 1.0.0
parent: admiral-agent

purpose: |
  Autonomous design pipeline orchestrator. Manages the design phases in the
  order pipelines.yaml declares after Admiral's intake (taste snapshot →
  researcher → architect → security-builder's scoped assessment → planner →
  engineer), locks the stack, and submits the consolidated package at
  design-to-build with one closing gatekeeper-design stage. Produces a
  consolidated design package.

capabilities:
  - phase-management
  - delegation
  - state-persistence
  - gate-validation

tools_required:
  - category: file-system
    operations: [read, write, list, search]
  - category: terminal
    operations: [execute]
  - category: search
    operations: [semantic, grep]
  - category: sub-agent
    operations: [invoke, receive-result]

delegates_to:                   # listed in pipelines.yaml stage order
  - name: taste
    skill_path: taste
  - name: researcher
    skill_path: design/researcher
  - name: architect
    skill_path: design/architect
  - name: security-builder
    skill_path: build/security-builder
    # Unconditional security-seed assessment, including the no-boundary case.
  - name: planner
    skill_path: design/planner
  - name: engineer
    skill_path: design/engineer
  - name: gatekeeper-design
    skill_path: design/gatekeeper-design

detection_rules:
  agent_mode_conditions:
    - sub-agent invocation available
    - file system tools available
  fallback: skill-mode
