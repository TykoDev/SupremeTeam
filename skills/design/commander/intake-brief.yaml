skill_name: commander
target_path: design/commander/
purpose: |
  Orchestrates the design pipeline from scoped request to consolidated design
  package. Owns phase ordering, gate routing, and stack-lock continuity across
  research, architecture, frontend design, the security seed, planning, and
  implementation guidance, in the order pipelines.yaml declares.
triggers:
  - design this system
  - create the design package
  - start the design pipeline
  - plan and architect this project
  - generate the full specification
inputs:
  - project goal, user needs, and scope constraints
  - technology preferences and prohibited options
  - effective-profile snapshot from Admiral/Taste when project or global Taste storage exists; snapshot includes canonical digest, project and global source revisions, resolved entries, shadowed entries, unresolved conflicts, and applicability decision
  - persistence context when delegated or resumed
outputs:
  - consolidated design package
  - taste_snapshot artifact, or the sanctioned no-profile applicability record
  - stack_lock record, or the sanctioned no-new-runtime applicability record
  - phase approval records
  - stack-lock registry for downstream consumers
gate:
  boundary: design-to-build
  submitter: commander
  evidence_keys:
    - decisions
    - architecture
    - interfaces
    - plan
    - acceptance
    - security_seed
    - stack_lock
    - taste_snapshot
    - ui_evidence
  authored_here:
    - stack_lock
  artifact_backed:
    - decisions
    - architecture
    - plan
    - taste_snapshot
  waivable:
    - stack_lock
    - taste_snapshot
    - ui_evidence
  not_waivable: decisions, architecture, interfaces, plan, acceptance, security_seed
severity_model: shared 4-tier (Critical | Major | Minor | Info)
required_contracts:
  - Execution-contract clauses stated verbatim in SKILL.md
  - Stack-lock continuity
  - Pipeline-owned gate routing
  - Read-only Taste consumption and candidate feedback routing
authoring_rules:
  - First-principles wording only
  - No provenance or comparison language
  - No references to planning-note filenames inside generated artifacts
  - Supporting files must be one level deep and directly referenced
acceptance:
  rubric_score: 100/100
  blocked_phrase_scan: zero hits
  cross_cutting_contracts_embedded: true
  package_ready: true
