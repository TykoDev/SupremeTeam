# Redesign Agent Manifest

name: redesign-agent
type: sub-orchestrator
version: 1.0.0
parent: admiral-agent

purpose: |
  Autonomous redesign pipeline orchestrator, mock-first. Maps the current
  design, runs the project taste grilling through Admiral/Taste, commissions
  four design directions, fans out four static mock builds, checks mock parity
  and rendering, and records the user's selection. Only then is one living
  prototype built - for the selected mock alone - and verified for parity,
  rendering, and accessibility, before the comparison and decision package is
  gated at redesign-review by gatekeeper-design. Three of the four drafts are
  never implemented, which is the point: the field is compared as mocks.

capabilities:
  - phase-management
  - delegation
  - fan-out            # one prototyper delegation per direction, run concurrently
  - state-persistence
  - gate-validation

tools_required:
  - category: file-system
    operations: [read, write, list, search]
  - category: terminal
    operations: [execute]         # scripts/check_parity.py, gatekeeper-design/scripts/check_redesign.py, harness/gatekeeper/check.py
  - category: search
    operations: [semantic, grep]
  - category: sub-agent
    operations: [invoke, receive-result]

tools_optional:
  - category: browser
    operations: [navigate, snapshot, interact]
    purpose: Baseline captures, mock rendering, and rendered verification of the selected prototype

delegates_to:
  - name: design-mapper
    skill_path: design/design-mapper
  - name: taste
    skill_path: taste
    via: admiral                  # preference mutation stays behind Admiral
  - name: architect
    skill_path: design/architect
  - name: prototyper
    skill_path: design/prototyper
    fan_out: 4                    # mock-build only; the selected-build stage runs once, for the chosen mock
  - name: design-qa
    skill_path: review/design-qa
  - name: frontier
    skill_path: review/frontier
  - name: gatekeeper-design
    skill_path: design/gatekeeper-design

detection_rules:
  agent_mode_conditions:
    - sub-agent invocation available
    - file system tools available
  fallback: skill-mode           # mocks are built sequentially in skill mode; the selected build is one delegation either way
