skill_name: redesign
target_path: design/redesign/
purpose: |
  Orchestrates the redesign pipeline for an existing user-facing surface: maps
  the current design, runs a project taste grilling, commissions four distinct
  design systems as static mocks with component catalogs at route and component
  parity, verifies and captures them, puts the choice to the user, builds the
  living single-page prototype for the selected direction only, and hands the
  chosen variant to the design pipeline.
triggers:
  - redesign the UI
  - refresh the look and feel
  - explore design directions
  - give me alternative design systems
  - compare four redesigns
inputs:
  - surface in scope, parity-defining flows, constraints, and non-goals
  - application source, running instance, or captures of the current surface
  - effective Taste snapshot before grilling and the grilled profile after
  - persistence context when delegated or resumed
gate:
  boundary: redesign-review
  submitter: redesign
  evidence_keys:
    - design_inventory
    - taste_grilling
    - taste_snapshot
    - design_directions
    - mock_set
    - mock_parity
    - mock_rendering
    - selection
    - selected_variant
    - parity_evidence
    - rendered_verification
    - accessibility_evidence
    - recommendation
    - residual_risk
  authored_here:
    - selection
    - recommendation
    - residual_risk
  artifact_backed:
    - design_inventory
    - taste_grilling
    - taste_snapshot
    - design_directions
    - mock_set
    - mock_parity
    - mock_rendering
    - selection
    - selected_variant
    - parity_evidence
    - rendered_verification
  waivable:
    - taste_snapshot
  no_fallback:
    - mock_rendering
  selection_dependent:
    - selected_variant
    - parity_evidence
    - rendered_verification
    - accessibility_evidence
outputs:
  - design inventory and baseline captures
  - taste grilling log and effective-profile snapshot
  - four design directions
  - four static mocks with token sets and component catalogs
  - mock parity records and mock captures across the set
  - the recorded user decision at reports/selection.md
  - one living design-system variant for the selected direction, with parity, rendered, and accessibility evidence
  - redesign package with comparison matrix, recommendation, and recorded decision
severity_model: shared 4-tier (Critical | Major | Minor | Info)
# Mirrors the eight contracts in SKILL.md "Execution Contract", in order.
# Any change to that section must be reflected here in the same order.
required_contracts:
  - Grill-Me Intake
  - Four distinct mocks
  - Mocks before implementation
  - Functional parity
  - Framework-free drafts
  - Taste read boundary
  - Design doctrine
  - Save-Protocol Adherence
authoring_rules:
  - First-principles wording only
  - No provenance or comparison language
  - No references to planning-note filenames inside generated artifacts
  - >-
      Supporting files sit one level deep (references/, agent/) and are directly
      referenced from SKILL.md. Two exceptions, each of which must still be directly
      referenced - a named sub-group under a bundled directory (agent/adapters/), and
      a nested skill shipped with its own SKILL.md and supporting tree
      (skill-maker/skill-creator/). Anything deeper that is neither is a packaging defect.
# Authoring-time checklist, not a shipped grade. Re-derived on every run; never
# read as a recorded result.
acceptance_checklist:
  - blocked-phrase scan returns zero hits
  - cross-cutting contracts embedded verbatim
  - every bundled file referenced from SKILL.md
  - package builds from the resolved output directory
