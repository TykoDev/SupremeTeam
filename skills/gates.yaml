  "evidence_type_rules": {
    "security_seed": "Scoped assessment {applicable: boolean, scope, decided_by, architecture_revision, reason, boundaries: [{id, control}]}. applicable false requires empty boundaries and is an assessed no-boundary determination, not a waiver; applicable true requires at least one boundary and its control. security-builder produces either assessment on every design. Bare n/a is not an assessment at schema 2.",
    "human_go": "Record {decision: go, approver, approval_reference, revision, decided_at}. Every named field is a non-blank string; decided_at is timezone-qualified ISO; revision equals approved_delivery. This checks a recorded decision, not the approver's real identity or freshness, which the release owner must verify immediately before rollout.",
    "scan": "Record with artifacts (hashed), tool, command, exit_code, observed_at, inputs [{path, sha256}] bound to the inspected source, and result.status in pass|fail|error|not-run|unavailable. Only pass satisfies the gate; unavailable or error is a data gap, never a clean scan. exit_code is an integer and must be 0 beside a pass. The record is the submitter's own statement (see the probe rule): status pass means the scanner exited 0, which is not proof that it found nothing.",
    "render": "Record with hashed captures/artifacts, breakpoints, themes, inputs bound to the rendered source, and result.status pass or inferred (inferred requires a limitation statement and is labelled INFERRED - no browser available). Breakpoints cover the responsive tiers design-doctrine.md section 4 requires for the changed surface.",
    "probe": "Record with hashed artifacts and result.status pass; executed probe logs are the artifacts. inputs [{path, sha256}] are optional and re-hashed whenever present (input hash drift), but unlike scan and render a probe may omit them: then nothing ties the record to any source, and the result lists it in warnings as attested. Every typed record is the submitter's own statement: check.py checks its shape, that each artifact exists and matches its digest, that each input still hashes as recorded, and that a pass does not sit beside a non-zero exit_code, and it never compares an artifact's content with what a record claims or re-runs a command (it reads `.md` and `.txt` artifacts for blocked phrases and local links only), so whether a log is the runner's own output is a gatekeeper judgement. At build-to-review, tests is the test-runner log and runtime is the startup/entry-point smoke log, each a hashed file under build/evidence/; a bare count or claim is not evidence. At investigation-review, reproduction is the log that reproduces the reported failure and evidence_chain is the trace from symptom to mechanism. At qa-review, test_matrix is the executed matrix log across the declared surface.",
    "findings": "Record {items: [{id, severity, status, owner?, reopen_trigger?, reason?}]}. Critical must be verified or not-applicable with reason. Major must be verified, not-applicable with reason, or deferred with owner and reopen_trigger (finding_policy.major_deferral). Minor and Info are recorded. Every field a rule needs named (reason, owner, reopen_trigger) must be a non-blank string: null, a number, a list or an object does not count as named.",
    "verdict": "APPROVED, or REVISE/ESCALATE accompanied by a challenge record {by, reason} that the gate preserves as a disputed recommendation. Both fields must be non-blank strings.",
    "stack_lock": "Record {slug, versions, overlay_sha256} validated against tech-stacks/registry.yaml (slug exists, overlay digest matches the registry entry and the overlay file, the file exists, and every declared version is one the entry offers), or an applicability record. A lock on an entry whose support_ends has passed, or against a registry whose verified_at is more than its verification_ttl_days old, still passes and is listed in warnings.",
    "revision_ref": "Record {revision, verdict}. verdict is a correctly hashed artifact of this package: the upstream boundary's cross-stage verdict record (evidence_type_params.<key>.upstream_boundary), which must be for that boundary, mechanically clean (pass true), carry a judgment by judgment_policy.cross_stage_gate that is valid and APPROVED, record the same revision, and belong to the same run. The approved manifest named by the record's `manifest` field (beside the verdict) must still fingerprint to the record's package_fingerprint, and every artifact it hashed must still hash as recorded, so an upstream package changed after approval fails here. A bare revision string is refused at schema 2.",
    "preference_diff": "Record {added, updated, deprecated, revoked, unchanged: [preference ids], before_digest, after_digest}. Every id collection is explicit and both digests are sha256 values.",
    "confirmation": "Record {actor, timestamp (timezone-qualified ISO), confirmed_scope in project|repository|global|session, candidate_ids, source_run}. candidate_ids is the exact set of added, updated, deprecated and revoked ids from preference_diff, without duplicates; check.py compares these sets. Unchanged ids are not candidates. Confirmation is never waivable: inferred preferences and any global write, promotion, reset, or revocation require this explicit record.",
    "conflict_analysis": "Record {conflicting_ids, precedence_decision, unresolved_conflicts, accessibility_policy_collisions}.",
    "persistence_result": "Record {requested_destinations: [non-blank destination strings], committed_revisions: [positive integers or non-blank revision identifiers], hashes: sha256 map, atomicity_status in committed|unchanged|not-required, rollback_result}.",
    "effective_profile": "Record {entries: [{id, source_scope, source_id}], digest}. Every effective entry carries its source scope and source id.",
    "consumer_handoff": "Record {consuming_pipeline, effective_profile_digest, applicability_summary}. The digest is the immutable effective-profile sha256 and must equal the digest of the effective_profile record in the same manifest; check.py compares the two.",
    "variant_set": "Record {artifacts, <list_field>: [{id, name, direction, ...files}], count}. The list name, the file fields, and the required length come from evidence_type_params, read by evidence key first and by the type name second, so one rule serves two keys at redesign-review: mock_set holds exactly four mocks under `mocks` with spec, tokens, components, and mock, and selected_variant holds the one built variant under `variants` with spec, tokens, components, and app. Ids are unique; every declared file is a correctly hashed artifact in the package; count, when present, equals the list length. parity_evidence and mock_parity are each a single check_parity.py probe record whose artifacts list names the hashed parity file it aggregates: check.py requires one mapping, so a list of per-mock records fails as 'must be a typed probe record at schema 2'. Binding inputs to the inventory and the scanned files is expected of the producer, which check_parity.py does, but the gate only re-hashes inputs a record carries - check_result_record demands non-empty inputs for scan and render records alone, so a probe with none passes the validator and is listed in warnings as attested.",
    "selection": "Record {schema_version, artifacts: [the hashed selection report], decision in evidence_type_params.selection.decision_values, chosen, recommended, decided_by, decided_at, basis}. decision 'variant' requires a non-null chosen that is one of the mock_set ids and makes selected_variant.<list_field>[0].id equal it; 'merge' and 'deferred' require chosen null. recommended is always a mock_set id. The decision is the hinge of the boundary: on 'variant' the four dependent keys named in evidence_type_params.selection.dependent_keys carry real evidence and may not stand down in any wording (an applicability record with any reason, or a bare sanctioned string, fails as 'stands down'), and on any other decision each of them carries the sanctioned wording evidence_type_params.selection.fallback_by_decision fixes for that decision - as the bare string at manifest schema 1, or as an applicability record whose reason is that wording at schema 2. check.py enforces both directions, and the record's fields above, only at manifest schema 2; at schema 1, which only a flat package outside a run may still declare, it checks neither - the key need only name a hashed artifact - so no dependent key is held to the decision there. Whether the recorded basis is the user's actual decision stays a gatekeeper judgement.",
    "decision_log": "The decisions artifact is the intake grilling log (grill-me-doctrine.md Output) and is parsed as fixed Markdown: four sections - Resolved decisions (ID, Decision, Chosen, Source), Deferred decisions (ID, Decision, Why deferral is safe, Owner, Reopen phase), Rejected options (ID, Option, Rationale), Non-goals and YAGNI deferrals (ID, Non-goal, Reopen trigger, Owner) - each holding one table with at least those columns. Every row fills every listed column (a dash, n/a, none, tbd or ? is empty), every ID is a D-<n> unique across the log, Source is user, codebase, prior-artifact or delegated-default, and Resolved decisions holds at least one row. Fenced code is ignored.",
    "acceptance_table": "The acceptance artifact holds a section 'Acceptance criteria' whose table has the columns ID, Slice, Observable condition, Check that proves it, Acceptor, at least one row, every cell filled, and unique AC-<n> ids (design/planner references/workflow.md). The same parse reads the approved design's acceptance at build-to-review for traceability.",
    "interface_set": "Record {artifacts, change: changed|none, items: [{id: IF-<n>, kind, name}]}. changed needs at least one item and none needs none; ids are unique and each stands as a whole id in one of the hashed artifacts.",
    "change_set": "Record {artifacts: [the hashed diff], changed_files: [{path, sha256, status: added|modified|deleted}]}. Every path is project-relative, named in the diff artifact, listed once, and - unless deleted, when it must not exist - still hashes to its sha256, so a file changed after the evidence was taken fails as hash drift.",
    "trace_map": "Record {items: [{acceptance: AC-<n>, changes: [paths], tests: [names]}], supporting?: [{path, reason}]}. Every acceptance id in the approved design's acceptance table (reached through the boundary's revision_ref binding) is covered by an item and no item names another; every change is in the implementation change_set and every changed file is in some item or in supporting with a reason; every test name appears verbatim in the hashed tests log."
  },
