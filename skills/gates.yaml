{
  "schema_version": 1,
  "kind": "supremeteam-gate-spec",
  "purpose": "Single deterministic source of truth for every gate boundary: required evidence keys, artifact-backed evidence, sanctioned fallback values, typed evidence records, finding policy, submitters, and the workflow-protocol state transition each boundary guards. harness/gatekeeper/check.py loads this file. The boundary tables in the gatekeeper skills and docs/gatekeepers.md repeat part of it by hand: test_documented_boundary_table_matches_gate_spec and test_gatekeeper_skill_boundary_tables_match_gate_spec in harness/gatekeeper/test_gate_manifests.py compare their boundary names and required-evidence keys with it (contracts/workflow-protocol.md on boundary names only). validation/test_docs_inventory.py GateProseTests compares the Submitter column of those tables and of workflow-protocol.md with each boundary's submitter; nothing compares their Guards columns.",
  "verdicts": [
    "APPROVED",
    "REVISE",
    "ESCALATE"
  ],
  "evidence_rules": {
    "required_evidence": "Every listed key must be present and non-falsy under the manifest's top-level evidence object.",
    "artifact_evidence": "These keys must reference at least one path that appears in the manifest's artifact_hashes map, so the evidence is a shipped, hashed file rather than a bare claim. A key whose value exactly equals one of its sanctioned fallback_values is exempt. Every sha256 this spec names - artifact_hashes, typed-record inputs, overlay digests, evidence_digests - is the line-ending-agnostic digest scripts/data_formats.py content_sha256 produces (text folded to LF, binary byte-for-byte), so a hash recorded on an LF checkout verifies on a CRLF one and the reverse; scripts/content_hash.py prints it for a file.",
    "fallback_values": "The only sanctioned non-artifact values for a key. Any other bare string fails the artifact-backing check.",
    "evidence_root": "Artifact paths are manifest-relative. Inside the canonical save layout (skillset-saves/runs/<run-id>/<phase>/) the authorised evidence root is the run directory when the manifest run_id matches the directory and _state.md, so sibling phase evidence is admissible. Otherwise the root is the manifest directory. Another run, traversal, absolute/drive/UNC paths, and links leaving the root are rejected.",
    "path_references": "Every path-shaped string in an artifact-backed evidence value must be a correctly hashed artifact, and so must every path-shaped string in a declared path field (artifacts, artifact, path, paths, captures, report, verdict) of any evidence record at manifest schema 2. Path-shaped includes absolute, drive-qualified and UNC forms, which can never be hashed and so fail rather than read as prose. A bare string or list on a key that is not artifact-backed is prose: a version number or a hostname there is not a file reference. Free-text annotations are ignored.",
    "manifest_schema_2": "schema_version 2 manifests must declare boundary and owner (the spec submitter), run_id when inside a run, revision equal to the single revisions value, typed records for keys listed in evidence_types, and applicability records {applicable: false, reason, scope, decided_by} instead of bare fallback strings. A manifest inside skillset-saves/runs/<run>/<phase>/ must declare schema 2: an absent or schema-1 version fails and the package is checked as schema 2 anyway, so the submitter receives every failure at once. A flat package at schema 1 still passes, and the result says in warnings that no typed check ran.",
    "applicability_records": "Only keys listed in fallback_values are waivable, and no_fallback removes a key from that set. A waiver is a typed applicability record naming reason, scope, and decided_by, and its reason must equal one of the wordings sanctioned for that key at that boundary (a boundary's own fallback_values replace the global list for the key, they do not add to it). A record whose reason is any other text fails as 'applicability reason not sanctioned'. A bare string is never a waiver at manifest schema 2: the sanctioned wording on its own fails there as 'bare fallback string not accepted at schema 2', and any other bare string is evidence, not a waiver - on an artifact-backed key it must name a hashed artifact, on a typed key it is held to that key's record check, and on an untyped claim key it is ordinary prose evidence that the gatekeeper reads. Schema 1, which only a flat package outside a run may still declare (manifest_schema_2), keeps the legacy form: a bare string that exactly equals a sanctioned wording waives the key, an artifact-backed key included (artifact_evidence), and since no typed check runs there, any other bare string must still name a hashed artifact on an artifact-backed key and is otherwise prose.",
    "no_fallback": "A boundary may list keys under no_fallback; those keys accept neither a sanctioned fallback string nor an applicability record at that boundary, even when a global fallback exists for the key. The bar is standing policy rather than a filter: it may name a key that no fallback map lists today, so a fallback added to a map later cannot silently reopen the waiver. The shipped spec bars only such a key, so harness/gatekeeper/test_gate_revise.py exercises the precedence against a synthetic spec that makes the key waivable.",
    "revise_packet": "check.py groups every failure by the evidence key it names and by that key's owner from evidence_owners (unassignable failures go to the submitter), and with --prior reports changed_evidence and unchanged_evidence from per-key digests, so one REVISE packet routes to every owner at once and a resubmission is re-judged only where it changed.",
    "verdict_records": "check.py emits gate_spec_digest, package_fingerprint, verdict_id, and evidence_digests; --verdict-out writes the durable record and --prior compares against it. A verdict is reusable only for the same boundary, submission, revision, fingerprint, and gate spec digest. The digests are plain sha256 values over public inputs, not signatures: they show two records were computed from the same manifest, spec and identity, and they catch accidental drift, but anyone can compute them, so a stored verdict proves nothing about who produced it or that check.py ran, and --prior is trusted as supplied. The result therefore reports gate_spec_is_shipped, registry_is_shipped and prior_record, and warns when any of them is not the shipped input; the reader at delivery re-runs check.py with no --gates, --registry or --prior and takes gate_spec_is_shipped: true from that fresh result."
  },
