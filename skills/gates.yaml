  "spec_revision": 4,
  "unchecked_fields": "Fields of this spec that a comparator does not read, so a wrong value here fails nothing. `guards` is no longer one of them. `scripts/validate_manifests.py` check_gates and `harness/gatekeeper/test_gate_manifests.py` GateSpecContractTests.test_gate_spec_shape still check only that the string is non-empty, but validation/test_orchestration.py GuardedTransitionTests reads what it says: it parses the `## States and transitions` table in contracts/workflow-protocol.md and requires every ALL-CAPS token in a `guards` string to be a state that table declares - or the name of the pipeline that closes this boundary, standing at the origin of the chain, which is how REDESIGN and TASTE are admitted - and every adjacent pair in a chain to be an allowed transition out of the state it leaves. Lowercase prose origins (security pipeline, investigation) and trailing commentary (with the chosen variant, or consuming pipeline) are not read, and neither is the Guards column of that document, which stays a deliberate paraphrase the drift test skips. `evidence_type_params.mock_set.required_count` gained a second reader for the same reason: validation/test_orchestration.py StageConditionTests pairs the counted evidence keys a stage owner holds at this boundary, in required_evidence order, with that owner's artifact-bearing stages in pipeline order, and requires each stage's `fan_out` - one when the stage declares none - to equal the required_count of the key it produces. So `mock-build` must fan out four ways for `mock_set` and `selected-build` must not fan out at all for `selected_variant`, and the fan-out and the count the gate enforces can no longer drift apart. Still unread: `purpose`, this note, `evidence_owners_note`, `evidence_rules`, `evidence_type_rules`, `spec_revision`, and `finding_policy.statement` - all prose that describes behaviour check.py implements in code rather than reads from here. What IS read per boundary: `guards` (against the state machine, as above), `submitter`, `required_evidence`, `artifact_evidence`, `fallback_values`, `no_fallback`, `evidence_types`, `evidence_type_params`, `evidence_owners`, `verdicts`, and `revise_policy.cycle_cap`.",
