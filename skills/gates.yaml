  "evidence_owners_note": "evidence_owners is keyed by (boundary, evidence key), not by key alone: the same key name at two boundaries is two different artifacts with two different writers. `findings` belongs to code-chief at review-to-delivery and to cso at security-review; `executed_probes` to qa at qa-review and to code-chief at review-to-delivery. ownership.yaml carries each as its own artifact id (findings / security-findings, executed-probes / review-executed-probes) because one id with two owners would break its single-writer rule, so artifact ids there and evidence keys here are deliberately separate namespaces and need not match by name. scripts/validate_manifests.py check_gates pairs the two files on the owner name, the only field both namespaces share - it checks that every submitter and every evidence_owners value resolves to an owner declared in ownership.yaml, and nothing about the key name.",
  "revise_policy": {
    "self_check": "The submitter runs check.py on its manifest (without --verdict-out) before submitting; a package that fails mechanically is never submitted, so a gatekeeper only spends judgment on packages that already pass the machine.",
    "one_packet": "A REVISE carries every mechanical failure and every judgment finding found in the pass, grouped by owner in revise_packet.by_owner; a gatekeeper never returns the first defect alone.",
    "parallel_fix": "The phase lead delegates each owner group of the packet in parallel and resubmits once; independent owners never wait on each other.",
    "delta_review": "On a resubmission with --prior, changed_evidence names the keys whose value or artifacts changed; the gatekeeper re-judges those keys and carries its prior judgment on unchanged_evidence, re-running only the mechanical pass over the whole package.",
    "cycle_cap": 2
  },
  "finding_policy": {
    "critical": "verified-before-gate",
    "major_deferral": "owner-and-reopen-trigger",
    "statement": "Critical blocks every gate until a verified fix or an explicit not-applicable reason. Major blocks unless verified, not-applicable with reason, or explicitly deferred with a named owner and reopen trigger recorded in the findings record; this is the reconciled reading of 'resolve Major before a gate' and 'Major requires a remediation owner before the gate'."
  }
