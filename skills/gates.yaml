  "evidence_owners_note": "evidence_owners is keyed by (boundary, evidence key), not by key alone: the same key name at two boundaries is two different artifacts with two different writers. `findings` belongs to code-chief at review-to-delivery and to cso at security-review; `executed_probes` to qa at qa-review and to code-chief at review-to-delivery. ownership.yaml carries each as its own artifact id (findings / security-findings, executed-probes / review-executed-probes) because one id with two owners would break its single-writer rule, so artifact ids there and evidence keys here are deliberately separate namespaces and need not match by name. scripts/validate_manifests.py check_gates pairs the two files on the owner name, the only field both namespaces share - it checks that every submitter and every evidence_owners value resolves to an owner declared in ownership.yaml, and nothing about the key name.",
  "revise_policy": {
    "self_check": "The submitter runs both validators before submitting: harness/gatekeeper/check.py on its manifest (without --verdict-out) and, at a boundary with a phase gatekeeper, that gatekeeper's scripts/check.py on the phase directory; a package that fails either mechanically is never submitted, so a gatekeeper only spends judgment on packages that already pass the machine and no REVISE round is spent on a filename, a missing packet field or a blocked phrase. Self-checks neither count as REVISE nor write cycle history.",
    "one_packet": "A REVISE carries every mechanical failure and every judgment finding found in the pass, grouped by owner in revise_packet.by_owner; a gatekeeper never returns the first defect alone. Critical/Major findings also carry expected, observed, remediation and verification; actions_by_owner contains the complete actionable records.",
    "parallel_fix": "The phase lead delegates each owner group of the packet in parallel and resubmits once; independent owners never wait on each other.",
    "delta_review": "On a resubmission with --prior, changed_evidence names the keys whose value or artifacts changed; the gatekeeper re-judges those keys and carries its prior judgment on unchanged_evidence, re-running only the mechanical pass over the whole package.",
    "revise_threshold": "A REVISE is returned only for a mechanical failure, a Critical finding, or a Major finding the finding_policy leaves unresolved. Minor and Info findings never produce a REVISE on their own: the gatekeeper records them in the verdict record and the submitter carries them into residual_risk or the next owner's handoff. A gate that finds only Minor or Info on a package that passed both validators returns APPROVED with those findings attached.",
    "batch_fix": "The packet is fixed as one revision per owner group, every finding together; a gatekeeper never asks for one finding at a time. On a resubmission a gatekeeper raises a new finding only against changed_evidence or a defect the change introduced, never a finding it could have raised on unchanged evidence in the first pass.",
    "rerun_scope": "On a REVISE the phase lead re-runs only the stages whose outputs the packet names, or whose declared requires in pipelines.yaml depend on an output that changed; every other stage's evidence and the prior judgment on it carry. A key the lead authors itself is corrected in place with no specialist re-run. Follow-up tests, probes and audits select only changed inputs and directly affected consumers. Carry unchanged hash-valid evidence with its original revision/time; never claim it was freshly executed. Full suites need explicit user scope, a mandatory contract, or concrete dependency impact. See contracts/review-discipline.md.",
    "cross_stage_scope": "At a boundary with a phase gatekeeper, the cross-stage gate re-judges a key's adequacy only where --prior against the phase verdict reports it in changed_evidence, or where that verdict was not APPROVED; otherwise it judges the crossing itself - lineage across revisions, boundary-to-package match, blocked phrases, the next consumer's contract, whether a contradiction across artifacts is real and whether a waiver reason is honest - and carries the phase gate's adequacy judgment, read from the `judgment` the phase gatekeeper's own verdict record holds (check.py reports it under prior_record.judgment), never from the submitter's checkpoint; a phase record with no valid judgment carries nothing, and the cross-stage gate judges every key. At the six boundaries with no phase gatekeeper it judges every key itself.",
    "grounding": "A gate judges a package against its source of truth and nothing else: the intake Decision Register (grill-me-doctrine.md Output, ids D-<n>), the plan's acceptance rows (design/planner, ids AC-<n>), this spec, and the catalog's doctrine and contract files. Every judgment finding names the required evidence key it is about (or none for a crossing defect), a basis from judgment_policy.basis_kinds, and - for Critical and Major - the hashed package artifacts it was read from. A requirement the gate believes is missing from the source of truth is not a REVISE to a specialist: it is an ESCALATE to admiral, which owns intake. A finding a later gate repeats is that gate's own only when it carries its own basis and anchors; agreeing with an earlier gate is not evidence. check.py --judgment checks the record mechanically (judgment_policy). Every judgment binds intake.artifact to the hashed canonical Intake decision log, including downstream boundaries. Intake controls resolved choices, deferrals, rejected options and non-goals; conflicting acceptance rows or proposed new requirements go to the user through admiral.",
    "cycle_cap": 3,
    "cycle_enforcement": "Every Gatekeeper always escalates to user on the third consecutive REVISE round. check.py persists per-gate streaks and a shared boundary budget under verdict_<boundary>.cycles.json beside the manifest; self-checks do not count, repeated revisions count once, and ids, --prior or output filenames cannot reset it. A held boundary requires a new explicit user decision, recorded by --reopen-reference; see contracts/review-discipline.md."
  },
  "finding_policy": {
    "critical": "verified-before-gate",
    "major_deferral": "owner-and-reopen-trigger",
    "minor_info": "recorded-never-revise",
    "statement": "Critical blocks every gate until a verified fix or an explicit not-applicable reason. Major blocks unless verified, not-applicable with reason, or explicitly deferred with a named owner and reopen trigger recorded in the findings record; this is the reconciled reading of 'resolve Major before a gate' and 'Major requires a remediation owner before the gate'. Minor and Info are recorded and carried, never a REVISE on their own (revise_policy.revise_threshold)."
  },
  "judgment_policy": {
    "basis_kinds": [
      "decision",
      "acceptance",
      "contract",
      "contradiction"
    ],
    "basis_rules": {
      "decision": "basis {kind: decision, ref: D-<n>, artifact}: artifact is a correctly hashed package artifact that contains the id; at a boundary that requires `decisions` it must be one of the paths that key names.",
      "acceptance": "basis {kind: acceptance, ref: AC-<n>, artifact}: the same, against the paths `acceptance` or `plan` name where the boundary requires them.",
      "contract": "basis {kind: contract, source, ref}: source is an existing catalog file (gates.yaml, a doctrine, a contract, a skill reference) and ref the section or rule.",
      "contradiction": "basis {kind: contradiction}: the finding's evidence names at least two hashed package artifacts that disagree."
    },
    "cross_stage_gate": "gatekeeper-admiral",
    "phase_gates": {
      "design-to-build": "gatekeeper-design",
      "redesign-review": "gatekeeper-design",
      "build-to-review": "gatekeeper-build",
      "review-to-delivery": "gatekeeper-code"
    },
    "record": "{boundary, submission_id, revision, gate, verdict, intake: {artifact: hashed Intake log}, findings: [{id, severity, key|null, statement, expected, observed, remediation, verification, basis, evidence: [hashed artifact path | manifest:evidence.<key>], owner?}], escalation?: {to, reason}}. The gatekeeper writes it beside its verdict as verdict_<boundary>.judgment.json (verdict_<boundary>.cross-stage.judgment.json for gatekeeper-admiral) and passes it to check.py --judgment with --verdict-out; the verdict record then embeds it under `judgment` and mechanical_only is false.",
    "checks": "check.py --judgment fails the record when: boundary, submission_id or revision differ from the package; gate is not the phase gate or the cross-stage gate for the boundary (a submitter never judges its own package); a finding names a key the boundary does not require, an owner other than evidence_owners gives, an unknown basis kind, a decision or acceptance id its artifact does not contain, a contract source that does not exist, or an anchor that is not a correctly hashed artifact; a Critical or Major finding has no anchor; APPROVED sits beside a mechanical failure or a Critical or Major finding; REVISE has neither a mechanical failure nor a grounded Critical or Major finding (revise_threshold); ESCALATE names no {to, reason}; or, on a resubmission to the same gate with --prior, a Critical or Major finding that is not carried from the prior judgment names a key outside changed_evidence (batch_fix). A rejected record is not written to --verdict-out. What the record cannot prove is that a grounded finding is correct: that stays the gate's judgement, now on the record with what it stood on. Every judgment must bind intake.artifact to the hashed canonical Intake log (or explicitly escalate unavailable Intake to user); decision and acceptance refs must be actual table-row ids. Critical/Major findings must supply expected, observed, remediation and verification. Mechanical pre-check output cannot overwrite a semantic judgment or cycle history."
  }
