  "evidence_type_rules": {
    "scan": "Record with artifacts (hashed), tool, command, exit_code, observed_at, inputs [{path, sha256}] bound to the inspected source, and result.status in pass|fail|error|not-run|unavailable. Only pass satisfies the gate; unavailable or error is a data gap, never a clean scan.",
    "render": "Record with hashed captures/artifacts, breakpoints, themes, inputs bound to the rendered source, and result.status pass or inferred (inferred requires a limitation statement and is labelled INFERRED - no browser available). Breakpoints cover the responsive tiers design-doctrine.md section 4 requires for the changed surface.",
    "probe": "Record with hashed artifacts and result.status pass; executed probe logs are the artifacts. At build-to-review, tests is the test-runner log and runtime is the startup/entry-point smoke log, each a hashed file under build/evidence/; a bare count or claim is not evidence. At investigation-review, reproduction is the log that reproduces the reported failure and evidence_chain is the trace from symptom to mechanism. At qa-review, test_matrix is the executed matrix log across the declared surface.",
    "audit": "Record with hashed artifacts and result.status pass.",
    "findings": "Record {items: [{id, severity, status, owner?, reopen_trigger?, reason?}]}. Critical must be verified or not-applicable with reason. Major must be verified, not-applicable with reason, or deferred with owner and reopen_trigger (finding_policy.major_deferral). Minor and Info are recorded.",
    "verdict": "APPROVED, or REVISE/ESCALATE accompanied by a challenge record {by, reason} that the gate preserves as a disputed recommendation.",
    "stack_lock": "Record {slug, versions, overlay_sha256} validated against tech-stacks/registry.yaml (slug exists, overlay digest matches registry and file, versions intersect), or an applicability record.",
    "revision_ref": "A non-empty approved upstream revision identifier.",
    "preference_diff": "Record {added, updated, deprecated, revoked, unchanged: [preference ids], before_digest, after_digest}. Every id collection is explicit and both digests are sha256 values.",
    "confirmation": "Record {actor, timestamp, confirmed_scope, candidate_ids, source_run}. candidate_ids is the exact candidate-id set. Confirmation is never waivable: inferred preferences and any global write, promotion, reset, or revocation require this explicit record.",
    "conflict_analysis": "Record {conflicting_ids, precedence_decision, unresolved_conflicts, accessibility_policy_collisions}.",
    "persistence_result": "Record {requested_destinations, committed_revisions, hashes, atomicity_status, rollback_result}.",
    "effective_profile": "Record {entries: [{id, source_scope, source_id}], digest}. Every effective entry carries its source scope and source id.",
    "consumer_handoff": "Record {consuming_pipeline, effective_profile_digest, applicability_summary}. The digest is the immutable effective-profile sha256.",
    "variant_set": "Record {artifacts, <list_field>: [{id, name, direction, ...files}], count}. The list name, the file fields, and the required length come from evidence_type_params, read by evidence key first and by the type name second, so one rule serves two keys at redesign-review: mock_set holds exactly four mocks under `mocks` with spec, tokens, components, and mock, and selected_variant holds the one built variant under `variants` with spec, tokens, components, and app. Ids are unique; every declared file is a correctly hashed artifact in the package; count, when present, equals the list length. parity_evidence and mock_parity are each a single check_parity.py probe record whose artifacts list names the hashed parity file it aggregates: check.py requires one mapping, so a list of per-mock records fails as 'must be a typed probe record at schema 2'. Binding inputs to the inventory and the scanned files is required by the gate but not machine-checked - check_result_record demands non-empty inputs only for scan and render records, so a probe with no inputs passes the validator and the binding is a gatekeeper judgement.",
    "selection": "Record {schema_version, artifacts: [the hashed selection report], decision in evidence_type_params.selection.decision_values, chosen, recommended, decided_by, decided_at, basis}. decision 'variant' requires a non-null chosen that is one of the mock_set ids and makes selected_variant.<list_field>[0].id equal it; 'merge' and 'deferred' require chosen null. recommended is always a mock_set id. The decision is the hinge of the boundary: on 'variant' the four dependent keys named in evidence_type_params.selection.dependent_keys carry real evidence and may not fall back, and on any other decision each of them carries the sanctioned wording evidence_type_params.selection.fallback_by_decision fixes for that decision - as the bare string at manifest schema 1, or as an applicability record whose reason is that wording at schema 2. check.py enforces both directions; whether the recorded basis is the user's actual decision stays a gatekeeper judgement."
  },
