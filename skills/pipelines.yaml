{
  "schema_version": 1,
  "kind": "supremeteam-pipeline-spec",
  "spec_revision": 3,
  "scheduling": "The stage order is a topological order of each pipeline's declared requires, not a serial mandate: stages whose requires are all satisfied run concurrently, delegated in one turn. So the three unconditional review lenses and every conditional lens whose condition holds start together on the approved build, test-surface and security-checkpoint start together once the implementation lands, and taste-snapshot and research start together on the decisions. A stage never waits on a stage it does not require, and a pipeline's wall-clock is its longest dependency chain, not the sum of its stages.",
  "conditional_outputs": "Every conditional stage emits its declared outputs: execution evidence, or a boundary-sanctioned applicability/no-op record on skip. Skipping is not an absent producer; an unsanctioned fallback cannot satisfy a required input. after_boundary stages run only after phase and cross-stage APPROVED verdicts, when approved-boundary becomes available.",
  "purpose": "Machine-readable definition of every Supreme Team pipeline, including Taste: ordered stages, stage owners, the gate boundary that closes the pipeline, and the pipeline-level deterministic scripts it must run itself. Owners must exist in team-manifest.yaml, boundaries in gates.yaml, and every declared script path on disk; validation/test_pipeline_contracts.py and scripts/validate_manifests.py enforce all three. An empty scripts list is a declaration, not an omission: see scripts_rule. The gate is modelled two ways across these ten pipelines: see gate_model. The prose workflows in the owning SKILL.md files elaborate these stages and must not contradict them.",
  "scripts_rule": "scripts lists only the deterministic scripts a pipeline must run itself, as project-relative paths that test_pipeline_contracts.py resolves on disk. Five pipelines declare an empty list - build, review, investigation, qa, and release - and that is a positive statement: those pipelines mandate no pipeline-level script of their own. Their determinism comes from the boundary instead, judged by skills/harness/gatekeeper/check.py, which the gatekeeper invokes and the pipeline does not. An empty list never means no tooling runs; the stage owners' own SKILL.md files name the commands they run, and those commands are not declared here.",
  "gate_model": "All ten pipelines declare a boundary and every boundary is closed by a gatekeeper, but only four model the gate as a stage. design, redesign, build, and review carry an explicit phase-gate stage owned by a phase gatekeeper that validates inside the pipeline before gatekeeper-admiral validates the same boundary as the cross-stage handoff. security, investigation, qa, taste, skill-creation, and release carry no phase-gate stage because they have no phase gatekeeper: their boundary is judged once, by gatekeeper-admiral. The missing stage is a statement about validation depth, not a gap in the stage list. Explicit after_boundary stages separate approved follow-through from pre-approval evidence: release rollout/documentation and investigation handoff run after, never before, this declared boundary. Mirrored in prose by contracts/responsibility-matrix.md. At those four phase-gated boundaries the cross-stage pass is bounded by gates.yaml revise_policy.cross_stage_scope: with an APPROVED phase verdict and no changed evidence it judges the crossing and carries the phase gate's adequacy judgment, so one package is not reviewed twice for the same question.",
  "stage_fields": {
    "step": "Required. Stage id, unique within the pipeline.",
    "owner": "Required. Must be a team-manifest.yaml member. When the stage declares an artifact, the owner must equal that artifact's writer in ownership.yaml; test_pipeline_contracts.py StageArtifactOwnershipTests enforces it.",
    "artifact": "Optional. Must be an ownership.yaml artifact id. The stage owner keeps the write even when the work is delegated.",
    "when": "Optional. A prose condition selecting the stage. No comparator evaluates the condition against a live run - that stays judgement, and failure_paths.when_condition_ambiguous governs it. What is checked is that the condition is stated somewhere on the handoff: validation/test_orchestration.py StageConditionTests requires the condition, minus any parenthetical gloss, to appear verbatim in the SKILL.md of the stage owner or of the pipeline owner, within a sentence of a word that frames it as a condition. Execution conditions and `delegate_when` are checked separately: required evidence is not made optional merely because delegation is conditional. Every declared condition is documented by the stage owner or invoking orchestrator, and a floor keeps the specialist-side share from eroding.",
    "delegate": "Optional. The skill the stage owner hands the work to while keeping the write. Declared by qa/evidence-capture (browse), qa/defect-record (qa-only, on a report-only run, which routing-doctrine.md and qa-only/SKILL.md both describe; qa remains the only qa-review submitter), and skill-creation/package (skill-creator, whose Package mode skill-maker Stage 5 calls). validation/test_orchestration.py PipelineOwnerRoleTests resolves the name: a delegate must be a skill on the team-manifest.yaml roster. Whether it is reachable from that stage is still judgement.",
    "delegate_when": "Optional condition for delegation only, never for producing the stage's evidence. QA owns unconditional executed-probes and defects, delegating browser probes or report-only discovery when appropriate.",
    "after_boundary": "Optional boolean. True places the stage strictly after APPROVED at the declared boundary; approved-boundary cannot be an intake input or be produced by a stage.",
    "dependency_graph": "Pipeline-level map from every stage id to its requires and produces lists; alternative to stage-local lists, not an exemption. All stages must have exactly one complete dependency declaration, and every external input and dependency is a non-blank string in a list.",
    "requires": "Required locally or in dependency_graph. List of dependency ids that must be present in pipeline external_inputs or produced by an earlier stage. scripts/validate_manifests.py and validation/test_pipeline_contracts.py reject missing and forward dependencies.",
    "produces": "Required locally or in dependency_graph. List of dependency ids made available to later stages. An id may be produced only once in a pipeline.",
    "then": "Optional. The pipeline or sub-pipeline the stage output continues into. Judgement.",
    "fan_out": "Optional. Parallel instances of the stage; a stage that declares none runs once. redesign/mock-build declares 4, matching mock_set.required_count in gates.yaml, which check.py does enforce on the submitted record. The numbers are compared: validation/test_orchestration.py StageConditionTests pairs the counted evidence keys gates.yaml evidence_owners assigns to a stage owner at the pipeline's boundary, in required_evidence order, with that owner's artifact-bearing stages in pipeline order, and requires each stage's fan-out to equal the required_count of the key it produces. prototyper owns two of them at redesign-review, so mock-build must fan out four ways for mock_set and selected-build must not fan out at all for selected_variant. design/redesign/agent/agent-manifest.yaml states the fanned-out number a third time for the same delegate and is compared too. A fan-out that stops producing the number the gate counts is a pipeline that cannot close."
  },
  "enforcement": {
    "scripts/validate_manifests.py": "check_pipeline_mirrors: every pipeline owner and stage owner is a team member; an artifact-bearing stage matches ownership.yaml's writer; every declared script exists under skills/; the boundary set equals gates.yaml's; exactly one pipeline owns each boundary; every pipeline name is a declared phase directory in save-ownership.yaml; complete dependency coverage, list shapes, unique step ids, forward/duplicate dependencies and after-boundary approval placement are checked.",
    "validation/test_pipeline_contracts.py": "The same owner, boundary, artifact, script, and requires/produces ordering facts as independent assertions, plus StageArtifactOwnershipTests and a taste-specific completeness test.",
    "validation/test_save_contracts.py": "Every pipeline name has a save phase directory, and the security and taste script declarations are present.",
    "validation/test_catalog_contracts.py": "StageDelegationTests: a pipeline owner's own documents must name every stage owner it delegates to.",
    "validation/test_orchestration.py": "PipelineOwnerRoleTests: every pipeline owner holds an orchestrator role and every delegate resolves to a roster skill. StageConditionTests: every `fan_out` equals the count its boundary requires, agent manifests restate it correctly, and every `when` condition is stated in the stage owner's or the pipeline owner's SKILL.md. DelegationGraphTests and SpecialistEntryRoutingTests traverse the delegation graph these stages define.",
    "judgement_only": "purpose, scripts_rule, gate_model, stage_fields, this enforcement map, failure_paths, and every then value. A when value is judgement as a run-time selector but its wording is compared against the owning prose, a fan_out value is compared against the gate spec, and a delegate name is resolved against the roster - see stage_fields for each. Stage execution remains an orchestrator responsibility, but declared requires/produces dependencies are mechanically checked against the listed order."
  },
  "failure_paths": {
    "declared_script_missing": "validate_manifests.py and test_pipeline_contracts.py both fail with the path. The pipeline does not run with the script silently skipped; either restore the script or remove the declaration as a recorded decision.",
    "stage_owner_unavailable": "The stage cannot start. Record the missing owner and enter BLOCKED under contracts/workflow-protocol.md rather than reassigning the stage to the pipeline owner.",
    "artifact_writer_mismatch": "ownership.yaml decides. A stage may not write an artifact whose declared writer it is not, and the mismatch fails validation before the gate would.",
    "when_condition_ambiguous": "Treat the stage as required and run it, or record an explicit applicability decision at the boundary. A skipped conditional stage with no record is an evidence gap, not a waiver.",
    "gatekeeper_unavailable": "The boundary cannot close. For the six pipelines with no phase gatekeeper there is no second validator to fall back to, so the run enters ESCALATE; a submitter self-check is never a verdict.",
    "spec_contradicts_skill_prose": "This file decides stages, owners, boundary, and scripts. The owning SKILL.md elaborates them and is the defect when the two disagree."
  },
