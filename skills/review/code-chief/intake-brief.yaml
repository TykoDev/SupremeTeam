skill_name: code-chief
target_path: review/code-chief/
purpose: |
  Schedules review lenses and merges what they find; the specialists review.
  Three lenses are unconditional - correctness, merge readiness, maintainability
  - and five are conditioned on a surface being present: security, adversarial,
  frontend, visual, and developer-experience. Delivers one consolidated package
  whose disagreements survive triage. Security governance and accepted-risk
  decisions are escalated to admiral for the cso pipeline, never signed here.
triggers:
  - review this codebase comprehensively
  - start the review pipeline
  - audit this change before merge
  - pressure-test this project
  - run the full review flow
inputs:
  - review target scope and risk context
  - available upstream design or build artifacts for traceability
  - persistence context when delegated or resumed
outputs:
  - consolidated review package
  - execution manifest with skip justifications
  - prioritized remediation summary
severity_model: shared 4-tier (Critical | Major | Minor | Info)
required_contracts:
  - Execution-contract clauses stated verbatim in SKILL.md
  - Cross-model synthesis
  - Save-Protocol Adherence
  - Pipeline-owned consolidated gate routing
gate:
  boundary: review-to-delivery
  submitter: code-chief
  evidence_keys:
    - review_verdict
    - findings
    - executed_probes
    - rendered_verification
    - residual_risk
    - revision_lineage
  authored_here:
    - review_verdict
    - findings
    - executed_probes
    - residual_risk
    - revision_lineage
  carried_unchanged:
    - rendered_verification
  artifact_backed:
    - executed_probes
    - rendered_verification
  waivable:
    - rendered_verification
  not_waivable: review_verdict, findings, executed_probes, residual_risk, revision_lineage
authoring_rules:
  - First-principles wording only
  - No provenance or comparison language
  - No references to planning-note filenames inside generated artifacts
  - Supporting files must be one level deep and directly referenced
acceptance:
  rubric_score: 100/100
  blocked_phrase_scan: zero hits
  cross_cutting_contracts_embedded: true
  package_ready: true
