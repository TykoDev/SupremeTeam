{
  "schema_version": 1,
  "kind": "supremeteam-runtime-manifest",
  "authority": {
    "python_floor": "runtime.python.minimum is the single authoritative Python floor for this catalog. scripts/check_runtime.py reads it and compares the live interpreter against it, reporting status too_old and refusing to report ready when the interpreter is below it. Two other numbers exist in the tree and neither is a floor. scripts/validate_manifests.py rejects a declared minimum below 3.9; that is a sanity bound on this manifest, not a second opinion about what the catalog supports. harness/gatekeeper/_gatecheck.py states no floor of its own: its docstring points back here rather than repeating a number, which is what keeps a stdlib-only portability note from reading as a second opinion about what the catalog supports. Where any of them disagree, this manifest decides and the other is the defect.",
    "node_floor": "node.required is false. Node is used only by browser-automation helper commands, no script reads node.minimum, and a host without Node is still reported ready.",
    "commands": "The commands map is the canonical invocation for each catalog entry point. validate_manifests.py requires fourteen of them to be present and non-empty and does not execute any of them. It does require the workflow named by ci.workflow to run every command listed in ci.commands verbatim and unconditionally, so a command string that names a script that has moved fails on every CI platform. The commands under ci.not_run take arguments or inspect the host they run on, and no CI step runs them. The installers suite needs a repository checkout: scripts/ is not part of an installed copy. The strings are written for a checkout and say python; run one by hand with the platform's launcher from launchers (python3 on macOS and Linux, py -3 on Windows), because Ubuntu 22.04 and later and current macOS ship no python. CI runs them as written, with the python that setup-python puts first on the path. In an installed copy the leading skills/ is the install root.",
    "who_reads_this_file": "Two scripts read this manifest - scripts/check_runtime.py and scripts/validate_manifests.py check_runtime - and CI runs both on every declared platform. scripts/test_validate_manifests.py validates this file in place and against fixtures that break each ci rule, so changing the ci block, the supported versions or a required command fails that suite. skills/runtime-manifest.yaml is also a REQUIRED_ASSET_GLOB in scripts/package_check.py, which validation/test_save_contracts.py PackageCheckTests and scripts/test_runtime_utilities.py both run. A value that enforcement.judgement lists can change without failing anything."
  },
  "stdlib_only_scope": {
    "claim": "runtime.python.stdlib_only_for_hooks_and_gates declares that the hook and gate code runs on a clean interpreter with no third-party import.",
    "covers": [
      "skills/harness/hooks/",
      "skills/harness/gatekeeper/",
      "skills/scripts/"
    ],
    "backing": "Asserted, not proven. validate_manifests.py checks only that this flag is the boolean true; nothing scans the imports of the directories above. The one deliberate third-party dependency in the catalog is PyYAML, declared under optional_dependencies with the stdlib fallback scripts/data_formats.py, whose existence on disk validate_manifests.py does check. A new third-party import added to a hook or a gate would leave this flag true and fail only on a host without that package."
  },
  "enforcement": {
    "machine_checked": "Two scripts read this manifest; both run in CI and scripts/test_validate_manifests.py runs the validator (see authority.who_reads_this_file). scripts/check_runtime.py compares the live interpreter against runtime.python.minimum, reports optional-dependency availability, and reports launchers - a missing optional dependency with a declared fallback is a warning, and an interpreter below the minimum is never reported ready. scripts/validate_manifests.py check_runtime asserts minimum is major.minor, not below 3.9 and among the supported versions, asserts stdlib_only_for_hooks_and_gates is the boolean true, resolves each optional-dependency fallback path on disk, requires all five launchers and fourteen named commands to be present and non-empty, and requires the CI matrix to name exactly windows, macos, and linux. check_ci then reads the workflow at ci.workflow and fails when it is missing or does not cover the declared platforms and launchers, every supported Python version, both PyYAML variants, the PyYAML install command, and every command in ci.commands, or when a command is neither run by CI nor explained under ci.not_run. Separately, scripts/package_check.py requires this file to be present in the delivery set, which validation/test_save_contracts.py and scripts/test_runtime_utilities.py both exercise.",
    "judgement": "authority, stdlib_only_scope, this enforcement block, failure_paths, the policy statement, every launcher string outside the CI platforms, every command string listed under ci.not_run, the reasons ci.not_run gives, node.minimum, and node.used_by. Nothing scans the imports of the stdlib-only directories, and no comparator compares a launcher string against a host."
  },
  "failure_paths": {
    "interpreter_below_minimum": "check_runtime.py reports status too_old and the host is not ready. Do not lower the minimum to make a host pass; that changes the contract for every host.",
    "optional_dependency_missing": "A warning while the declared stdlib fallback exists on disk. If the fallback is also missing, validate_manifests.py fails and the dependency is no longer optional.",
    "check_runtime_unavailable": "The runtime is unverified, not verified. Record the failed probe and treat any runtime-dependent claim as unproven under contracts/evidence-standards.md.",
    "manifest_unreadable": "validate_manifests.py reports the file as unreadable and exits non-zero. No default floor is assumed in its place.",
    "floor_disagreement": "This manifest decides. Correct the disagreeing docstring or bound rather than editing this file to match it."
  },
  "runtime": {
    "python": {
      "minimum": "3.13",
      "supported": [
        "3.13",
        "3.14"
      ],
      "stdlib_only_for_hooks_and_gates": true,
      "optional_dependencies": [
        {
          "name": "PyYAML",
          "used_by": [
            "skill-maker/skill-creator/scripts/quick_validate.py",
            "validation/trigger_eval.py"
          ],
          "purpose": "full YAML frontmatter compatibility. quick_validate.py falls back to the stdlib parser; validation/trigger_eval.py is a paid, networked routing measurement and exits without PyYAML, so the fallback below does not cover it",
          "fallback": "skills/scripts/data_formats.py",
          "install": "python -m pip install PyYAML"
        }
      ]
    },
    "node": {
      "minimum": "20",
      "required": false,
      "used_by": [
        "browser-automation helper commands only"
      ]
    }
  },
  "launchers": {
    "windows": "py -3",
    "macos_linux": "python3",
    "codex": "bundled Python runtime path supplied by the host",
    "claude_code": "host-selected Python interpreter",
    "copilot": "host-selected Python interpreter"
  },
  "commands": {
    "runtime_check": "python skills/scripts/check_runtime.py",
    "manifests": "python skills/scripts/validate_manifests.py",
    "hooks": "python -m unittest discover -s skills/harness/hooks -p \"test_*.py\"",
    "gates": "python -m unittest discover -s skills/harness/gatekeeper -p \"test_*.py\"",
    "validation": "python -m unittest discover -s skills/validation -p \"test_*.py\"",
    "scripts": "python -m unittest discover -s skills/scripts -p \"test_*.py\"",
    "taste": "python -m unittest discover -s skills/taste -p \"test_*.py\"",
    "installers": "python -m unittest discover -s scripts -p \"test_*.py\"",
    "skill_creator": "python -m unittest discover -s skills/skill-maker/skill-creator -p \"test_*.py\"",
    "readiness": "python skills/harness/hooks/check_readiness.py --host auto",
    "hook_registration": "python skills/harness/hooks/verify_registration.py --host auto",
    "hook_repair_preview": "python skills/harness/hooks/repair_registration.py --host <host> --scope project",
    "gate_check": "python skills/harness/gatekeeper/check.py --boundary <boundary> --package <manifest.json>",
    "save_lifecycle": "python skills/harness/hooks/save_run.py <create|checkpoint|heartbeat|complete|block|release|recover|status> --run-id <run>",
    "scan_record": "python skills/scripts/scan_record.py --out <run>/security/evidence/scan-<tool>.json --input <lockfile> -- <scanner command>",
    "output_paths": "python skills/scripts/output_paths.py --kind <reports|artifacts|evidence|packages|manifest|coverage> --run-id <run> --phase <phase> --name <file>  # representative run-scoped form, and every kind it names works with exactly these arguments. It is NOT the whole set: `--kind` accepts 17 values and `output_paths.py --help` enumerates them authoritatively. Other kinds take other arguments and fail if invoked with this line - verdict needs --boundary, trajectory needs --session, core takes only _state.md / _lock.md / _audit-trail.md as --name, and guards / project_preferences / global_preferences take neither --run-id nor --phase. Read --help before copying this for a kind it does not name.",
    "package_check": "python skills/scripts/package_check.py --root .",
    "package_archive": "python skills/scripts/package_check.py --root . --out .harness-state/packages/supremeteam.zip",
    "stack_detect": "python skills/scripts/check_runtime.py --project-root . --detect-project",
    "parity_check": "python skills/scripts/check_parity.py --level <mock|full> --inventory <design-inventory.json> --app <mock.html|app.html> --components <components.html> --out <run>/redesign/evidence/<mock-parity-<id>|parity-<id>>.json",
    "content_hash": "python skills/scripts/content_hash.py <path> [<path> ...] [--project-root .]"
  },
  "ci_matrix": [
    {
      "platform": "windows",
      "launcher": "py -3"
    },
    {
      "platform": "macos",
      "launcher": "python3"
    },
    {
      "platform": "linux",
      "launcher": "python3"
    }
  ],
  "ci": {
    "workflow": ".github/workflows/ci.yml",
    "pyyaml": [
      "with",
      "without"
    ],
    "commands": [
      "runtime_check",
      "manifests",
      "hooks",
      "gates",
      "validation",
      "scripts",
      "taste",
      "installers",
      "skill_creator",
      "package_check",
      "package_archive"
    ],
    "not_run": {
      "readiness": "reports the hook registration of the host it runs on, and a CI runner has none",
      "hook_registration": "inspects the host configuration, which a CI runner does not have",
      "hook_repair_preview": "needs the host the operator chooses",
      "gate_check": "needs a boundary and a gate manifest",
      "save_lifecycle": "needs a subcommand and a run id",
      "scan_record": "wraps an external scanner and needs its lockfile",
      "output_paths": "a placeholder form: each kind takes its own arguments",
      "stack_detect": "inspects the project it is pointed at, and this repository is a catalog with no stack",
      "parity_check": "needs a design inventory and a rendered app",
      "content_hash": "needs the paths to hash"
    }
  },
  "policy": "A missing optional dependency is a warning when the stdlib fallback is available; a runtime below minimum is never reported ready."
}
