schema_version: 2
kind: supremeteam-tech-stack-registry
verified_at: "2026-11-12"
verification_ttl_days: 180
floor_rule: >-
  A component's minimum is the oldest release that the overlay's guidance holds for
  and that upstream supports until at least verified_at plus verification_ttl_days.
  Where upstream publishes no support window, the second condition becomes the oldest
  release line that still receives fixes, and the overlay's floor_reason says so in
  one line. Re-reading the registry is then mechanical: collect the release and
  support dates of every component on the day, apply this rule, move the minimums, set
  verified_at.
verification: >-
  verified_at is the day every min_versions entry below was last set by floor_rule
  from upstream's published releases and support dates, and read against its overlay's
  own text; the entries are re-read together, so one date covers them all. A minimum
  is the least the overlay's guidance holds for, not a pin: a project on any release
  at or above it locks without a warning. min_versions names each component and gives
  its minimum as text (the number 3.10 would be 3.1). verified_through, where an
  overlay has one, names the newest release line it was read against; support_ends
  gives, per component, the last day upstream supports the minimum's release, as a
  date or as a month where that is all upstream publishes. The gate reads all of it
  when it checks a stack lock (harness/gatekeeper/check.py, check_lock_versions and
  warn_registry_freshness): a component the entry names that the lock leaves out, or a
  value that is not one version, fails; a version below its minimum, a version past
  verified_through, a support_ends day that has passed, and a registry whose
  verified_at is more than verification_ttl_days old each pass with a warning, because
  choosing a supported version is the owner's decision and the gate makes none.
  deno-typescript is kept and marked as ending: Deno supports the runtime until about
  October 2027 and then stops developing it.
provenance: >-
  Each sha256 is the digest of the shipped overlay text with line endings folded to
  LF. It detects an edited overlay; it does not say where the guidance came from.
  source names the file in the _refs authoring workspace this overlay was written in.
  That workspace is not shipped with the catalog, so source cannot be followed from a
  checkout and is checked only when the workspace is present.
